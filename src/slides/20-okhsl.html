<main data-slide>
  <h2>Same numbers. <em>OKHSL.</em></h2>

  <div class="stack">
    <div data-strip data-flush class="row"></div>
    <div data-strip data-flush class="row" id="greys"></div>
    <div class="numbers"></div>
  </div>

  <div class="controls">
    <label class="check"><input data-shuffled type="checkbox" /><span>shuffled</span></label>
  </div>

  <p class="note">
    The identical triples — same three hues, <code>l: 0.55</code> for every
    anchor — read through Ottosson's OKHSL instead of HSL, then stretched the
    same way. Desaturated, the measured lightness runs from
    <mark data-low></mark> to <mark data-high></mark>.
    <mark>Asked for one lightness, got one.</mark>
  </p>

  <style>
    .stack { display: grid; gap: 2px; width: min(100%, 46em); }
    .row { height: 5em; }

    .controls { font-size: var(--step--1); color: var(--muted); }
    .check { display: flex; align-items: center; gap: var(--space-3xs); }

    .numbers {
      display: flex;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: var(--step--2);
      color: var(--muted);
    }

    .numbers > * { flex: 1; text-align: center; }

    .note { max-width: 38em; color: var(--muted); }
  </style>

  <script>
    // Exactly the slide before, with one word changed: hsl → okhsl.
    let three = hues(3);

    function draw() {
      const anchors = three.map((h) => okhsl({ h, c: 0.85, l: 0.55 }));
      const colors = stretch(anchors, 5, (t, a, b) => mix(a, b, t));

      swatches(colors, $slide.querySelector('.row'));
      swatches(colors.map(grey), $slide.querySelector('#greys'));

      // luma() resolves any CSS colour through a 1px canvas — no library needed.
      const measured = colors.map((color) => Math.round(luma(color) * 100));

      $slide.querySelector('.numbers').replaceChildren(
        ...measured.map((value) => {
          const cell = document.createElement('span');
          cell.textContent = `${value}%`;
          return cell;
        }),
      );

      // Never let the prose claim a number the demo did not just produce.
      $slide.querySelector('[data-low]').textContent = `${Math.min(...measured)}%`;
      $slide.querySelector('[data-high]').textContent = `${Math.max(...measured)}%`;
    }

    // Deck-wide pick mode. rewind() re-picks from the same seed, so flipping
    // this changes *which* three, not the roll.
    const shuffleBox = $slide.querySelector('[data-shuffled]');
    shuffleBox.checked = shuffled();
    const onShuffle = () => { shuffled(shuffleBox.checked); rewind(); three = hues(3); draw(); };
    shuffleBox.addEventListener('input', onShuffle);
    draw();

    return () => shuffleBox.removeEventListener('input', onShuffle);
  </script>
</main>
