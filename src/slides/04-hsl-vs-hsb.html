<main data-slide>
  <h2>I confused HSL with HSB<br />for <em>years</em></h2>

  <div class="models">
    <figure>
      <div class="views">
        <div class="square square--hsb">
          <span class="dot" style="right: 0; top: 0"></span>
        </div>
        <div class="disk disk--hsb">
          <span class="hand"><span class="dot"></span></span>
        </div>
      </div>
      <p class="values">hsb(<span data-h></span>, 100%, <b>100%</b>) · corner</p>
    </figure>

    <figure>
      <div class="views">
        <div class="square square--hsl">
          <span class="dot" style="right: 0; top: 50%"></span>
        </div>
        <div class="disk disk--hsl">
          <span class="hand"><span class="dot"></span></span>
        </div>
      </div>
      <p class="values">hsl(<span data-h></span>, 100%, <b>50%</b>) · halfway</p>
    </figure>
  </div>

  <label class="control">
    <span>hue</span>
    <input type="range" min="0" max="359" value="0" />
    <output></output>
  </label>

  <p class="note">
    Bulding stuff like a color picker using these models made me play with these models and understand them better.
  </p>

  <style>
    :scope {
      --h: 0;
    }

    h2 { max-width: none; }

    .models {
      display: grid;
      /* minmax(0, …) so the caption text can never widen a column. */
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--space-m);
      width: min(100%, 44em);
    }

    figure { margin: 0; min-width: 0; display: grid; gap: var(--space-2xs); }

    .views {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--space-xs);
    }

    .square,
    .disk {
      position: relative;
      min-width: 0;
      aspect-ratio: 1;
      border: 1px solid var(--faint);
    }

    /* Side view. Saturation left to right, brightness bottom to top. Corner = pure hue. */
    .square--hsb {
      background:
        linear-gradient(to top, #000, rgb(0 0 0 / 0)),
        linear-gradient(to right, #fff, rgb(255 255 255 / 0)),
        hsl(var(--h) 100% 50%);
    }

    /* Side view. Saturation left to right, lightness bottom to top. Corner = white. */
    .square--hsl {
      background:
        linear-gradient(to top, #000, rgb(0 0 0 / 0) 50%),
        linear-gradient(to bottom, #fff, rgb(255 255 255 / 0) 50%),
        linear-gradient(to right, #808080, hsl(var(--h) 100% 50%));
    }

    /* Top view. Hue round the rim, 0° at twelve o'clock, clockwise — same as the wheels later. */
    .disk {
      border-radius: 50%;
      --ring: conic-gradient(in hsl longer hue, hsl(0 100% 50%), hsl(360 100% 50%));
    }

    /* HSB's top face: the middle is white (B 100%, S 0%). */
    .disk--hsb {
      background: radial-gradient(circle, #fff, rgb(255 255 255 / 0)), var(--ring);
    }

    /* HSL's lightness axis laid out radially: black in the middle, pure hue halfway, white at the rim. */
    .disk--hsl {
      background:
        radial-gradient(circle closest-side, #000, rgb(0 0 0 / 0) 50%, rgb(255 255 255 / 0) 50%, #fff),
        var(--ring);
    }

    /* The pure hue sits halfway out, not on the rim. */
    .disk--hsl .hand .dot { top: 25%; }

    .hand {
      position: absolute;
      inset: 0;
      transform: rotate(calc(var(--h) * 1deg));
    }

    .hand .dot { left: 50%; top: 0; margin: -0.55em 0 0 -0.55em; }

    .dot {
      position: absolute;
      width: 1.1em;
      height: 1.1em;
      margin: -0.55em -0.55em 0 0;
      border: 2px solid var(--white);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgb(0 0 0 / 0.4);
    }

    .values {
      margin: 0;
      font-family: var(--font-mono);
      font-size: var(--step--2);
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .values b { font-weight: var(--weight-medium); color: var(--highlight); }

    .control {
      display: flex;
      align-items: center;
      gap: var(--space-s);
      font-size: var(--step--1);
      color: var(--muted);
    }

    .control input { width: min(20em, 45vw); accent-color: var(--highlight); }

    output {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--onBg);
    }

    .note { max-width: 38em; color: var(--muted); }
  </style>

  <script>
    const slider = $slide.querySelector('input');
    const readout = $slide.querySelector('output');

    function draw() {
      // Always three digits, so the captions never change width.
      const h = String(slider.value).padStart(3, '0');
      $slide.style.setProperty('--h', slider.value);
      readout.textContent = `${h}°`;
      $slide.querySelectorAll('[data-h]').forEach((el) => { el.textContent = h; });

      // Both squares sampled, 10 × 10 each: HSB's saturation × brightness, HSL's saturation × lightness.
      const grid = (space) => Array.from({ length: 100 }, (_, i) => space({ h: +h, c: (i % 10) / 9, l: Math.floor(i / 10) / 9 }));
      colorDebug([...grid(hsv), ...grid(hsl)], { model: 'hsl' });
    }

    slider.addEventListener('input', draw);
    draw();

    return () => slider.removeEventListener('input', draw);
  </script>
</main>
