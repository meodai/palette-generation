<main data-slide data-invert data-align="center">
  <h1>Questions</h1>

  <p class="lead">
    <a href="https://elastiq.ch" target="_blank" rel="noopener">elastiq.ch</a> ·
    <a href="https://github.com/meodai/" target="_blank" rel="noopener">github.com/meodai</a> ·
    <a href="https://codepen.io/meodai" target="_blank" rel="noopener">codepen.io/meodai</a>
  </p>

  <a class="repo" href="https://github.com/meodai/palette-generation" target="_blank" rel="noopener">
    <div class="qr" data-qr></div>
    <span class="repo__url"></span>
  </a>

  <style>
    h1 {
      max-width: none;
      color: var(--highlight);
    }

    .lead {
      max-width: none;
      color: var(--muted);
      line-height: 1.9;
    }

    a { color: var(--onBg); text-decoration-color: var(--highlight); }

    /* the deck itself, to take home */
    .repo {
      display: grid;
      justify-items: center;
      gap: var(--space-xs);
      margin-top: var(--space-l);
      text-decoration: none;
      font-size: var(--step--1);
      color: var(--muted);
    }

    .qr {
      width: min(11em, 30vh);
    }

    /* white modules on the slide's black */
    .qr-light { fill: var(--black); }
    .qr-dark { stroke: var(--white); }
  </style>

  <script>
    const repo = 'https://github.com/meodai/palette-generation';
    $slide.querySelector('.repo').href = repo;
    $slide.querySelector('.repo__url').textContent = repo.replace('https://', '');
    qr(repo);
  </script>
</main>
