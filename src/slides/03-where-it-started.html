<main data-slide data-cols>
  <h2 class="full">This is where my <em>journey</em> started</h2>

  <figure data-shot>
    <img src="picker.png" alt="The Photoshop color picker" />
    <div class="placeholder">drop <code>public/picker.png</code> here</div>
  </figure>

  <div class="aside">
    <p>My understanding of color models was based on observations.</p>  
    <section data-notes>
    <p class="note">
      Passion for color models grew from color pickers in paint and design software. <br/> Amiga Painter, Photoshop, Corel Draw.
      No idea how any of them worked, but <mark>knew what they looked like</mark>.
    </p>
    </section>
  </div>

  <style>
    :scope {
      align-content: center;
      /* The screenshot carries the slide; the text is the caption. */
      grid-template-columns: 1.35fr 1fr;
    }

    figure {
      margin: 0;
    }

    img {
      width: 100%;
      border: 1px solid var(--faint);
    }

    .placeholder {
      display: grid;
      place-items: center;
      aspect-ratio: 4 / 3;
      border: 1px dashed var(--hairline);
      color: var(--muted);
      font-size: var(--step--1);
    }

    figure:has(img[data-loaded]) .placeholder {
      display: none;
    }

    img:not([data-loaded]) {
      display: none;
    }

    .aside {
      display: grid;
      gap: var(--space-s);
      align-content: center;
    }

    .note {
      color: var(--muted);
    }
  </style>

  <script>
    const shot = $slide.querySelector('img');
    if (shot.complete && shot.naturalWidth) shot.dataset.loaded = '';
    shot.addEventListener('load', () => { shot.dataset.loaded = ''; });

    const h = rnd(360);
    const grid = Array.from({ length: 100 }, (_, i) => hsv({ h, c: (i % 10) / 9, l: Math.floor(i / 10) / 9 }));
    colorDebug(grid, { model: 'hsv' });
  </script>
</main>
