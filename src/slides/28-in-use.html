<main data-slide>
  <h2>Don't get hung up on <em>perceptual</em></h2>

  <div class="demo">
    <div class="half half--a"><div class="inner inner--l"></div></div>
    <div class="half half--c"><div class="inner inner--r"></div></div>
  </div>

  <p class="legend">click the squares to bring them <b>together</b></p>

  <section data-notes>
    <p class="note">
      The two squares look like the same color. But are they?
      <a href="https://colorandcontrast.com/#/simultaneous-contrast" target="_blank" rel="noopener">Simultaneous
      contrast</a> Color does not exist in a vacuum. Many effects affect our perception of color. Explore the other effects at
      <a href="https://colorandcontrast.com/" target="_blank" rel="noopener">colorandcontrast.com</a>.
    </p>
  </section>

  <style>
    :scope { --t: 0; }

    h2 { max-width: none; }

    .demo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(100%, 46em);
      height: 11em;
      cursor: pointer;
      user-select: none;
    }

    /* clicked: the squares travel to the shared edge and meet */
    .demo[data-together] { --t: 1; }

    .half { position: relative; }
    .half--a { background: var(--bg1); }
    .half--c { background: var(--bg2); }

    /* The squares start centred in their halves and travel to the shared edge
       as --t goes 0 → 1, where they meet — and stop matching. */
    .inner {
      position: absolute;
      top: 30%;
      width: 30%;
      height: 40%;
      transition: left 0.6s var(--ease);
    }

    .inner--l { left: calc(35% + var(--t) * 35%); background: var(--fg1); }
    .inner--r { left: calc(35% - var(--t) * 35%); background: var(--fg2); }

    .legend {
      margin: 0;
      font-size: var(--step--1);
      color: var(--muted);
    }

    .legend b { font-weight: var(--weight-medium); color: var(--onBg); }

    .note { max-width: 42em; color: var(--muted); }
  </style>

  <script>
    const bg1 = 'rgb(34 111 102)';   // teal
    const bg2 = 'rgb(193 0 74)';     // crimson
    const fg2 = 'rgb(246 122 2)';    // orange, on the crimson

    // The other square is NOT the same orange: a touch darker and redder, so
    // that on the teal it reads like fg2 on the crimson. Tune these two numbers
    // until they match by eye on the projector.
    const o = toOklch(fg2);
    const fg1 = oklch({ h: o.h - 3, c: o.c * 0.96, l: o.l - 0.045 });

    for (const [name, value] of Object.entries({ bg1, fg1, bg2, fg2 })) {
      $slide.style.setProperty(`--${name}`, value);
    }

    colorDebug([bg1, fg1, bg2, fg2], { model: 'oklch' });

    const demo = $slide.querySelector('.demo');
    const legend = $slide.querySelector('.legend b');
    const toggle = () => {
      demo.toggleAttribute('data-together');
      legend.textContent = demo.hasAttribute('data-together') ? 'apart' : 'together';
    };
    demo.addEventListener('click', toggle);

    return () => demo.removeEventListener('click', toggle);
  </script>
</main>
