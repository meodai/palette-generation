<main data-slide>
  <h2>OKLCH to the <em>rescue</em></h2>

  <div class="stack">
    <div data-strip data-flush class="row"></div>
    <div data-strip data-flush class="row" id="greys"></div>
    <div class="numbers"></div>
  </div>

  <div class="controls">
    <label><span>L</span><input data-l type="range" min="0" max="100" value="75" /><output></output></label>
    <label><span>C</span><input data-c type="range" min="0" max="100" value="32" /><output></output></label>
  </div>

  <section data-notes>
    <ol class="note">
      <li>Same six, in OKLCH: one L, one C</li>
      <li>Desaturated, measured: <mark data-low></mark> → <mark data-high></mark></li>
      <li><mark>Asked for one lightness, got one</mark></li>
      <li>Rest of the talk: earning that</li>
      <li><a href="https://codepen.io/meodai/full/KagxwW" target="_blank" rel="noopener">CodePen</a></li>
    </ol>
  </section>

  <style>
    .stack { display: grid; gap: 2px; width: min(100%, 46em); }
    .row { height: 6em; }

    .numbers {
      display: flex;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: var(--step--2);
      color: var(--muted);
    }

    .numbers > * { flex: 1; text-align: center; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-s) var(--space-m);
      font-size: var(--step--1);
      color: var(--muted);
    }

    label { display: flex; align-items: center; gap: var(--space-2xs); }
    input[type='range'] { width: 9em; accent-color: var(--highlight); }

    output {
      min-width: 3em;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--onBg);
    }

    .note { max-width: 38em; color: var(--muted); }
  </style>

  <script>
    // Slide 2's six, by their OKLCH hue — HSL's 60° steps are not OKLCH's.
    const hues6 = Array.from({ length: 6 }, (_, i) => toOklch(hsl({ h: i * 60, c: 0.9, l: 0.5 })).h);

    const lIn = $slide.querySelector('[data-l]');
    const cIn = $slide.querySelector('[data-c]');
    const outs = $slide.querySelectorAll('output');

    // One lightness, one chroma. The default C (0.32 → chroma 0.128) is blue's
    // ceiling at L 0.75 inside sRGB, the lowest of the six. Push C past it and
    // the browser pulls that hue back in — the measured L starts to drift.
    function draw() {
      const l = lIn.value / 100;
      const c = cIn.value / 100;
      outs[0].textContent = `${lIn.value}%`;
      outs[1].textContent = (c * 0.4).toFixed(3);

      const colors = hues6.map((h) => oklch({ h, c, l }));
      swatches(colorDebug(colors, { model: 'oklch' }), $slide.querySelector('.row'));
      swatches(colors.map(grey), $slide.querySelector('#greys'));

      const measured = colors.map((color) => Math.round(lightness(color) * 100));
      $slide.querySelector('.numbers').replaceChildren(
        ...measured.map((value) => Object.assign(document.createElement('span'), { textContent: `${value}%` })),
      );
      $slide.querySelector('[data-low]').textContent = `${Math.min(...measured)}%`;
      $slide.querySelector('[data-high]').textContent = `${Math.max(...measured)}%`;
    }

    lIn.addEventListener('input', draw);
    cIn.addEventListener('input', draw);
    draw();

    return () => {
      lIn.removeEventListener('input', draw);
      cIn.removeEventListener('input', draw);
    };
  </script>
</main>
