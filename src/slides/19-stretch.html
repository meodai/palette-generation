<main data-slide>
  <h2>Stretch three to <em>five</em></h2>

  <div class="stage">
    <div data-wheel></div>
    <div class="rows">
      <div class="row"><span>3</span><div data-strip id="anchors"></div></div>
      <div class="row"><span id="n">→ 5</span><div data-strip id="out"></div></div>
    </div>
  </div>

  <div class="controls">
    <label><span>min angle</span><input data-angle type="range" min="10" max="120" step="1" /><output data-angle-out></output></label>
    <label><span>steps</span><input type="range" min="3" max="12" value="5" /></label>
    <label class="check"><input data-shuffled type="checkbox" /><span>shuffled</span></label>
    <button type="button">reroll</button>
  </div>

  <section data-notes>
    <ol class="note">
      <li>Same hues, interpolated in oklab.</li>
      <li><code>chroma.scale()</code> -> RGB Default.</li>
      <li>The anchors -> Character; Steps -> resolution.</li>
      <li><code>scaleSpreadArray</code> ships in
      <a href="https://github.com/meodai/rampensau/blob/main/src/utils.ts#L84" target="_blank" rel="noopener">rampensau</a></li>
    </ol>
  </section>

  <style>
    .stage {
      display: flex;
      align-items: center;
      gap: var(--space-l);
      width: min(100%, 46em);
    }

    [data-wheel] { flex: none; width: 7em; }
    .rows { flex: 1; min-width: 0; display: grid; gap: var(--space-xs); }

    .row {
      display: grid;
      grid-template-columns: 3em 1fr;
      align-items: center;
      gap: var(--space-s);
      font-family: var(--font-mono);
      font-size: var(--step--1);
      color: var(--muted);
    }

    #anchors { height: 4em; }
    #out { height: 7em; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-s) var(--space-m);
      font-size: var(--step--1);
      color: var(--muted);
    }

    label { display: flex; align-items: center; gap: var(--space-2xs); }
    input[type='range'] { width: 12em; accent-color: var(--highlight); }
    output { min-width: 2.6em; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--onBg); }
    .check { gap: var(--space-3xs); }

    button {
      border: 1px solid var(--hairline);
      border-radius: 2px;
      padding: 0.4em 1em;
      background: none;
      color: var(--onBg);
      font: inherit;
      cursor: pointer;
    }

    button:hover { color: var(--highlight); border-color: var(--highlight); }


    .note { max-width: 40em; color: var(--muted); }
  </style>

  <script>
    const steps = $slide.querySelector('input[type="range"]:not([data-angle])');
    const button = $slide.querySelector('button');
    const label = $slide.querySelector('#n');
    const out = $slide.querySelector('#out');

    let three = hues(3);

    function draw() {
      const anchors = three.map((h) => hsl({ h, c: 0.85, l: 0.55 }));
      const n = +steps.value;

      wheel(three);
      swatches(anchors, $slide.querySelector('#anchors'));
      label.textContent = `→ ${n}`;
      swatches(colorDebug(stretch(anchors, n, (t, a, b) => mix(a, b, t)), { model: 'hsl' }), out);
    }

    // Deck-wide pick mode. rewind() re-picks from the same seed, so flipping
    // this changes *which* three, not the roll.
    const shuffleBox = $slide.querySelector('[data-shuffled]');
    shuffleBox.checked = shuffled();
    const onShuffle = () => { shuffled(shuffleBox.checked); rewind(); three = hues(3); draw(); };
    shuffleBox.addEventListener('input', onShuffle);

    // Deck-wide min angle, the slider from slide 17: same roll, new spacing.
    const angle = $slide.querySelector('[data-angle]');
    const angleOut = $slide.querySelector('[data-angle-out]');
    const showAngle = () => { angleOut.textContent = `${angle.value}°`; };
    angle.value = spacing();
    showAngle();
    const onAngle = () => { spacing(+angle.value); rewind(); three = hues(3); draw(); showAngle(); };
    angle.addEventListener('input', onAngle);
    const next = () => { reseed(); three = hues(3); draw(); };

    steps.addEventListener('input', draw);
    button.addEventListener('click', next);
    draw();

    return () => {
      angle.removeEventListener('input', onAngle);
      shuffleBox.removeEventListener('input', onShuffle);
      button.removeEventListener('click', next);
    };
  </script>
</main>
