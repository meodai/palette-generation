<main data-slide>
  <h2>Now <em>chroma</em> too</h2>

  <div class="stage">
    <div data-wheel></div>
    <div class="rows">
      <div class="row"><span>+ L</span><div data-strip id="light"></div></div>
      <div class="row"><span>+ C</span><div data-strip id="both"></div></div>
    </div>
  </div>

  <div class="controls">
    <label><span>lightness</span><input data-l0 type="range" min="0" max="100" value="15" /><input data-l1 type="range" min="0" max="100" value="90" /></label>
    <label><span>chroma</span><input data-c0 type="range" min="0" max="100" value="15" /><input data-c1 type="range" min="0" max="100" value="90" /></label>
    <label class="check"><input data-flip type="checkbox" /><span>flip chroma</span></label>
    <label class="check"><input data-shuffled type="checkbox" /><span>shuffled</span></label>
    <button type="button">reroll</button>
  </div>

  <p class="note">
    Same three, same lightness walk as the slide before. Now chroma walks too —
    <mark>from a minimum to a maximum, and a coin flip for which way</mark>.
    Both axes moving, then the stretch. That is the whole ramp.
  </p>

  <style>
    .stage {
      display: flex;
      align-items: center;
      gap: var(--space-l);
      width: min(100%, 46em);
    }

    [data-wheel] { flex: none; width: 7em; }
    .rows { flex: 1; min-width: 0; display: grid; gap: var(--space-xs); }

    .row {
      display: grid;
      grid-template-columns: 3em 1fr;
      align-items: center;
      gap: var(--space-s);
      font-family: var(--font-mono);
      font-size: var(--step--1);
      color: var(--muted);
    }

    #light { height: 3.2em; }
    #both { height: 6em; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-s) var(--space-m);
      font-size: var(--step--1);
      color: var(--muted);
    }

    label { display: flex; align-items: center; gap: var(--space-2xs); }
    input[type='range'] { width: 7em; accent-color: var(--highlight); }
    .check { gap: var(--space-3xs); }

    button {
      border: 1px solid var(--hairline);
      border-radius: 2px;
      padding: 0.4em 1em;
      background: none;
      color: var(--onBg);
      font: inherit;
      cursor: pointer;
    }

    button:hover { color: var(--highlight); border-color: var(--highlight); }

    .note { max-width: 40em; color: var(--muted); }
  </style>

  <script>
    const q = (sel) => $slide.querySelector(sel);
    const value = (sel) => Number(q(sel).value) / 100;
    const sliders = [...$slide.querySelectorAll('input[type="range"]')];
    const flipBox = q('[data-flip]');

    let three = hues(3);

    function draw() {
      const lMin = value('[data-l0]'), lMax = value('[data-l1]');
      const cMin = value('[data-c0]'), cMax = value('[data-c1]');
      const flip = flipBox.checked;

      wheel(three);

      // Row one is the slide before, unchanged: lightness walks, chroma sits at 0.5.
      const light = three.map((h, i) => oklch({ h, c: 0.5, l: lerp(i / 2, lMin, lMax) }));
      swatches(stretch(light, 5, (t, a, b) => mix(a, b, t)), q('#light'));

      // Row two: chroma walks as well — the same t, or 1 - t when flipped.
      const both = three.map((h, i) => {
        const t = i / 2;
        return oklch({ h, c: lerp(flip ? 1 - t : t, cMin, cMax), l: lerp(t, lMin, lMax) });
      });
      swatches(stretch(both, 5, (t, a, b) => mix(a, b, t)), q('#both'));
    }

    // Deck-wide pick mode. rewind() re-picks from the same seed, so flipping
    // this changes *which* three, not the roll.
    const shuffleBox = q('[data-shuffled]');
    shuffleBox.checked = shuffled();
    const onShuffle = () => { shuffled(shuffleBox.checked); rewind(); three = hues(3); draw(); };
    shuffleBox.addEventListener('input', onShuffle);

    const reroll = () => { reseed(); three = hues(3); draw(); };

    sliders.forEach((input) => input.addEventListener('input', draw));
    flipBox.addEventListener('input', draw);
    q('button').addEventListener('click', reroll);
    draw();

    return () => {
      sliders.forEach((input) => input.removeEventListener('input', draw));
      shuffleBox.removeEventListener('input', onShuffle);
    };
  </script>
</main>
