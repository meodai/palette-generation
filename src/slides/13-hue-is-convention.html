<main data-slide data-align="center">
  <h2>Hue angle is a <em>convention</em>,<br />not a fact</h2>

  <div class="facts">
    <p>Thirty-six paint wheels, thirty-six places for yellow — and on a screen, RGB spun on its diagonal. <strong>All of them work.</strong></p>
    <p class="punch">What matters is the <mark>distance</mark> between the colors you pick. Which wheel you measure it on is secondary.</p>
  </div>
