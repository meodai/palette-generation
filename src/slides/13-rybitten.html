<main data-slide data-cols>
  <h2 class="full">RYBitten, my <em>playground</em></h2>

  <div class="wheel-col">
    <div class="wheel">
      <div class="ring" data-ring></div>
      <div data-wheel></div>
    </div>
    <p class="hint">click or drag the wheel: <b>start hue</b> <output></output></p>
  </div>

  <div class="legend">
    <div class="tabs" role="tablist"></div>

    <label class="control">
      <span>wheel</span>
      <select></select>
    </label>

    <div class="corners" data-corners></div>
    <div class="picked" data-strip></div>

    <section data-notes>
      <ol class="note">
        <li>Every wheel → different harmonies: <mark>the layout of the wheel is the hues</mark></li>
        <li>Hold one rule, flip through 3–4 wheels, watch yellow move</li>
        <li><a href="https://rybitten.space/" target="_blank" rel="noopener">rybitten.space</a></li>
      </ol>
    </section>
  </div>

  <style>
    :scope {
      grid-template-columns: 1fr 1fr;
      align-content: center;
      column-gap: var(--space-2xl);
    }

    .wheel-col {
      display: grid;
      gap: var(--space-xs);
      justify-items: center;
      align-content: center;
    }

    .hint {
      margin: 0;
      font-size: var(--step--2);
      color: var(--muted);
      text-align: center;
    }

    .hint b { font-weight: var(--weight-medium); color: var(--onBg); }
    .hint output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--onBg); }

    /* the start dot: the white ring every dot has, plus a black outline */
    .wheel-start { fill: none; stroke: var(--onBg); stroke-width: 1; }

    .wheel {
      position: relative;
      width: min(100%, 17em);
      aspect-ratio: 1;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      justify-self: center;
    }

    .wheel > * { position: absolute; inset: 0; }

    .ring {
      border-radius: 50%;
      /* a ring, like the outer ring on the wheels slide */
      mask: radial-gradient(circle closest-side, #0000 0 49.5%, #000 49.5%);
    }

    /* the dots sit on the colored band; no outline needed */
    .wheel-ring { display: none; }

    .legend {
      display: grid;
      gap: var(--space-s);
      align-content: center;
    }

    .tabs { display: flex; gap: var(--space-2xs); }

    .tabs button {
      padding: 0.3em;
      border: 1px solid transparent;
      border-radius: 50%;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }

    .tabs button:hover { color: var(--onBg); }
    .tabs button[aria-selected='true'] { color: var(--highlight); border-color: currentColor; }
    .tabs svg { display: block; width: 2em; height: 2em; }

    .control {
      display: flex;
      align-items: center;
      gap: var(--space-s);
      font-size: var(--step--1);
      color: var(--muted);
    }

    output {
      min-width: 3em;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--onBg);
    }

    select {
      max-width: 22em;
      font: inherit;
      color: var(--onBg);
      background: var(--bg);
      border: 1px solid var(--hairline);
      padding: 0.2em 0.5em;
    }

    .corners, .picked { display: flex; gap: 2px; max-width: 24em; }
    .corners { height: 1.4em; }
    .picked { height: 3em; }
    .corners > *, .picked > * { flex: 1; }

    .note { max-width: 24em; color: var(--muted); }
  </style>

  <script>
    const STEPS = 24;

    // Every "harmony rule" is a set of angles. Nothing else.
    const RULES = {
      complementary: [0, 180],
      split: [0, 150, 210],
      triadic: [0, 120, 240],
      tetradic: [0, 90, 180, 270],
      analogous: [-30, 0, 30],
    };

    const select = $slide.querySelector('select');
    const tabs = $slide.querySelector('.tabs');
    const ring = $slide.querySelector('[data-ring]');

    // The rule as an icon: a ring, a dot per angle, no words.
    const icon = (angles) =>
      `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="0.8" />${angles
        .map((a) => {
          const t = ((a - 90) * Math.PI) / 180;
          return `<circle cx="${(12 + 9 * Math.cos(t)).toFixed(2)}" cy="${(12 + 9 * Math.sin(t)).toFixed(2)}" r="2" fill="currentColor" />`;
        })
        .join('')}</svg>`;

    tabs.innerHTML = Object.entries(RULES)
      .map(([name, angles]) => `<button role="tab" aria-label="${name}" title="${name}" data-rule="${name}">${icon(angles)}</button>`)
      .join('');

    // `cubes` is RYBitten's Map of historical wheels; each one is eight corner colors.
    for (const [key, { title, author, year }] of cubes) {
      select.add(new Option(`${author} — ${title} (${year})`, key));
    }
    select.value = 'rgb';

    let rule = 'complementary';
    // Start on the middle of a slice; every rule's angles are multiples of 15°, so all dots stay centered.
    // Start on the middle of a slice; click or drag on the wheel moves it, snapped to slices.
    const wheelEl = $slide.querySelector('.wheel');
    const snap = (angle) => (Math.floor((((angle % 360) + 360) % 360) / (360 / STEPS)) + 0.5) * (360 / STEPS);
    let base = snap(rnd(360));

    function draw() {
      const { cube } = cubes.get(select.value);
      $slide.querySelector('output').textContent = `${Math.round(base)}°`;
      tabs.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', b.dataset.rule === rule));

      // RYB hue is its own angle: 0 red, 120 yellow, 240 blue.
      const steps = Array.from({ length: STEPS }, (_, i) => ryb({ h: ((i + 0.5) / STEPS) * 360, c: 1, l: 0.5 }, cube));
      ring.style.background = `conic-gradient(${steps
        .map((color, i) => `${color} ${(i / STEPS) * 360}deg ${((i + 1) / STEPS) * 360}deg`)
        .join(', ')})`;

      // The rule, on this wheel: same angles, whatever colors the cube puts there.
      const picked = RULES[rule].map((a) => {
        const h = (base + a + 360) % 360;
        return { h, color: ryb({ h, c: 1, l: 0.5 }, cube) };
      });
      const svg = wheel(picked).querySelector('svg');
      // The start hue is the first pick: give its dot a black outline on top of the white ring.
      const first = svg.querySelector('.wheel-dot');
      const outline = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      outline.setAttribute('class', 'wheel-start');
      outline.setAttribute('cx', first.getAttribute('cx'));
      outline.setAttribute('cy', first.getAttribute('cy'));
      outline.setAttribute('r', String(Number(first.getAttribute('r')) + 1.1));
      svg.append(outline);
      swatches(picked.map((p) => p.color));

      // The cube itself, in wheel order: white, red, orange, yellow, green, blue, violet, black.
      const corners = [0, 1, 3, 2, 6, 4, 5, 7].map((i) => `rgb(${cube[i].map((v) => Math.round(v * 255)).join(' ')})`);
      swatches(corners, $slide.querySelector('[data-corners]'));

      colorDebug([...picked.map((p) => p.color), ...corners, ...steps], { model: 'hsl' });
    }

    const onTab = (event) => {
      const button = event.target.closest('[data-rule]');
      if (!button) return;
      rule = button.dataset.rule;
      draw();
    };

    // 0° at twelve o'clock, clockwise — the same convention as the conic gradient.
    const angleAt = (event) => {
      const { left, top, width, height } = wheelEl.getBoundingClientRect();
      const x = event.clientX - (left + width / 2);
      const y = event.clientY - (top + height / 2);
      return (Math.atan2(x, -y) * 180) / Math.PI;
    };
    let held = false;
    const onPointer = (event) => {
      if (event.type === 'pointerdown') {
        held = true;
        try { wheelEl.setPointerCapture(event.pointerId); } catch {}
      } else if (!held) return;
      const next = snap(angleAt(event));
      if (next === base) return;
      base = next;
      draw();
    };
    const release = () => { held = false; };

    select.addEventListener('change', draw);
    tabs.addEventListener('click', onTab);
    wheelEl.addEventListener('pointerdown', onPointer);
    wheelEl.addEventListener('pointermove', onPointer);
    addEventListener('pointerup', release);
    addEventListener('pointercancel', release);
    draw();

    return () => {
      select.removeEventListener('change', draw);
      tabs.removeEventListener('click', onTab);
      wheelEl.removeEventListener('pointerdown', onPointer);
      wheelEl.removeEventListener('pointermove', onPointer);
      removeEventListener('pointerup', release);
      removeEventListener('pointercancel', release);
    };
  </script>
</main>
