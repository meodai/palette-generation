<main data-slide>
  <h2>Why does changing <em>only</em> the hue<br />give me a mess?</h2>

  <div class="stack">
    <div data-strip data-tall></div>
    <div class="numbers"></div>
  </div>

  <section data-notes>
    <p class="note">
      Six hues. Identical saturation. Identical lightness. I asked for the same
      color six times and got <mark>one that screams and one that vanishes</mark>.
    </p>
  </section>

  <style>
    .stack { display: grid; gap: var(--space-2xs); width: 100%; }

    .numbers {
      display: flex;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: var(--step--2);
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .numbers > * { flex: 1; min-width: 0; text-align: center; white-space: nowrap; }

    .note {
      max-width: 38em;
      color: var(--muted);
    }
  </style>

  <script>
    // Same S, same L — only H moves. This is the whole problem, in one line.
    const flat = Array.from({ length: 6 }, (_, i) => ({ h: i * 60, c: 0.9, l: 0.5 }));

    swatches(colorDebug(flat.map(hsl), { model: 'hsl' }));

    // The numbers under each swatch: h° s% l% — the same two, six times.
    $slide.querySelector('.numbers').replaceChildren(
      ...flat.map(({ h, c, l }) => Object.assign(document.createElement('span'), {
        textContent: `${h}° ${Math.round(c * 100)}% ${Math.round(l * 100)}%`,
      })),
    );
  </script>
</main>
