<main data-slide>
  <h2>Why does changing <em>only</em> the hue<br />give me a mess?</h2>

  <div data-strip data-tall></div>

  <section data-notes>
    <p class="note">
      Six hues. Identical saturation. Identical lightness. I asked for the same
      color six times and got <mark>one that screams and one that vanishes</mark>.
    </p>
  </section>

  <style>
    .note {
      max-width: 38em;
      color: var(--muted);
    }
  </style>

  <script>
    // Same S, same L — only H moves. This is the whole problem, in one line.
    const flat = Array.from({ length: 6 }, (_, i) => ({ h: i * 60, c: 0.9, l: 0.5 }));

    swatches(colorDebug(flat.map(hsl), { model: 'hsl' }));
  </script>
</main>
