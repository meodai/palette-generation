<main data-slide data-align="center">
  <h2>Every slide is <em>live</em></h2>

  <div class="hints">
    <p>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7.5v9l8 4.5 8-4.5v-9L12 3Z" /><path d="M4 7.5 12 12l8-4.5M12 12v9" /></svg>
      <span><kbd>c</kbd> Color inspector.</span>
    </p>
    <p>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 8.6 18.6 19.6 7.6 16.4 4.4 5.4 15.4Z" /><path d="M7.7 13.7 10.3 16.3" /></svg>
      <span><kbd>e</kbd> Slide's source: Edit, <kbd>⌘S</kbd>, it redraws.</span>
    </p>
    <p>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6z" /><path d="M9 8h6M9 12h6M9 16h3" /></svg>
      <span><kbd>s</kbd> Speaker notes in new tab</span>
    </p>
    <p>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="2.5" /><circle cx="18.5" cy="12" r="2.5" /><path d="M8 12h8" /></svg>
      <span><kbd>b</kbd> Token beam: <code data-token>connecting…</code></span>
    </p>
  </div>

  <div class="codes">
    <a class="code" href="https://palettarium.color.pizza/" target="_blank" rel="noopener">
      <div class="qr" data-qr-palettarium></div>
      <span>palettarium</span>
    </a>
    <a class="code" href="https://meodai.github.io/color-palette-shader/" target="_blank" rel="noopener">
      <div class="qr" data-qr-shader></div>
      <span>palette shader</span>
    </a>
  </div>

  <section data-notes>
    <p class="note">Everything is editable / inspectable</p>
    <ul class="note">
      <li><a href="https://palettarium.color.pizza/" target="_blank" rel="noopener">palettarium.color.pizza</a></li>
      <li><a href="https://meodai.github.io/color-palette-shader/" target="_blank" rel="noopener">meodai.github.io/color-palette-shader</a></li>
    </ul>
  </section>

  <style>
    h2 { max-width: none; }

    .hints {
      display: grid;
      gap: var(--space-s);
      max-width: 34em;
      margin-top: var(--space-m);
      text-align: left;
    }

    .hints p {
      display: grid;
      grid-template-columns: 2em 1fr;
      align-items: center;
      gap: var(--space-s);
      color: var(--muted);
    }

    .hints b { color: var(--onBg); font-weight: var(--weight-medium); }

    .hints svg {
      width: 2em;
      height: 2em;
      fill: none;
      stroke: var(--onBg);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    kbd {
      padding: 0.1em 0.4em;
      border: 1px solid var(--hairline);
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: 0.85em;
      color: var(--onBg);
    }

    /* two things to take home, small enough to sit under the hints */
    .codes {
      display: flex;
      justify-content: center;
      gap: var(--space-l);
      margin-top: var(--space-m);
    }

    .code {
      display: grid;
      justify-items: center;
      gap: var(--space-2xs);
      text-decoration: none;
      font-size: var(--step--1);
      color: var(--muted);
    }

    .code:hover { color: var(--highlight); }
    .qr { width: min(9em, 20vh); }
    .qr-light { fill: var(--bg); }
    .qr-dark { stroke: var(--onBg); }

    code[data-token] {
      font-family: var(--font-mono);
      color: var(--highlight);
      letter-spacing: 0.06em;
    }

    .note { margin-top: var(--space-m); color: var(--muted); }
    ul.note { margin-top: var(--space-xs); padding-left: 1.2em; }
    .note a { color: inherit; }
  </style>

  <script>
    document.documentElement.dataset.spotlight = '';

    colorDebug(randomRamp(5).map(oklch), { model: 'oklch' });

    qr('https://palettarium.color.pizza/', $slide.querySelector('[data-qr-palettarium]'));
    qr('https://meodai.github.io/color-palette-shader/', $slide.querySelector('[data-qr-shader]'));

    // The beam token, live: it changes if the session reconnects.
    const token = $slide.querySelector('[data-token]');
    const showToken = () => { token.textContent = $beam.token ?? ($beam.state === 'error' ? 'no connection' : 'connecting…'); };
    showToken();
    document.addEventListener('beam', showToken);

    return () => {
      document.removeEventListener('beam', showToken);
      delete document.documentElement.dataset.spotlight;
    };
  </script>
</main>
