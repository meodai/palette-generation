<main data-slide>
  <h2>But I asked for one Lightness!</h2>

  <div class="stack">
    <div data-strip data-flush class="row"></div>
    <div data-strip data-flush class="row" id="greys"></div>
    <div class="numbers"></div>
  </div>

  <section data-notes>
    <ol class="note">
      <li>Measured L: <mark data-low></mark> → <mark data-high></mark></li>
      <li>HSL's L = a <mark>coordinate</mark>, not a brightness</li>
    </ol>
  </section>

  <style>
    .stack { display: grid; gap: 2px; width: min(100%, 46em); }
    .row { height: 6em; }

    .numbers {
      display: flex;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: var(--step--2);
      color: var(--muted);
    }

    .numbers > * { flex: 1; text-align: center; }

    .note { max-width: 38em; color: var(--muted); }
  </style>

  <script>
    const colors = Array.from({ length: 6 }, (_, i) => hsl({ h: i * 60, c: 0.9, l: 0.5 }));

    swatches(colorDebug(colors, { model: 'hsl' }), $slide.querySelector('.row'));
    swatches(colors.map(grey), $slide.querySelector('#greys'));

    // lightness() reads OKLab L back from the rendered pixel — no library needed.
    const measured = colors.map((color) => Math.round(lightness(color) * 100));

    $slide.querySelector('.numbers').replaceChildren(
      ...measured.map((value) => {
        const cell = document.createElement('span');
        cell.textContent = `${value}%`;
        return cell;
      }),
    );

    $slide.querySelector('[data-low]').textContent = `${Math.min(...measured)}%`;
    $slide.querySelector('[data-high]').textContent = `${Math.max(...measured)}%`;
  </script>
</main>
