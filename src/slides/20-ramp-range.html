<main data-slide>
  <h2>Now <em>chroma</em> too</h2>

  <div class="rows">
    <div class="row"><span>3</span><div data-strip id="anchors"></div></div>
    <div class="row"><span>→ 5</span><div data-strip id="out"></div></div>
  </div>

  <div class="controls">
    <label><span>lightness</span><input data-l0 type="range" min="0" max="100" value="12" /><input data-l1 type="range" min="0" max="100" value="92" /></label>
    <label><span>chroma</span><input data-c0 type="range" min="0" max="100" value="5" /><input data-c1 type="range" min="0" max="100" value="80" /></label>
    <label class="check"><input data-flip type="checkbox" /><span>flip chroma</span></label>
    <label class="check"><input data-shuffled type="checkbox" /><span>shuffled</span></label>
    <button type="button">reroll hues</button>
  </div>

  <p class="note">
    Lightness has its range. Give chroma one as well, and a coin flip for which
    way it runs. <mark>Both axes walking, then the stretch</mark> — the same
    three hues we have had since slide 12, and nothing else has changed.
  </p>

  <style>
    .rows { display: grid; gap: var(--space-xs); width: min(100%, 46em); }

    .row {
      display: grid;
      grid-template-columns: 3em 1fr;
      align-items: center;
      gap: var(--space-s);
      font-family: var(--font-mono);
      font-size: var(--step--1);
      color: var(--muted);
    }

    #anchors { height: 4em; }
    #out { height: 7em; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-s) var(--space-m);
      font-size: var(--step--1);
      color: var(--muted);
    }

    label { display: flex; align-items: center; gap: var(--space-2xs); }
    input[type='range'] { width: 7em; accent-color: var(--highlight); }
    .check { gap: var(--space-3xs); }

    button {
      border: 1px solid var(--hairline);
      border-radius: 2px;
      padding: 0.4em 1em;
      background: none;
      color: var(--onBg);
      font: inherit;
      cursor: pointer;
    }

    button:hover { color: var(--highlight); border-color: var(--highlight); }

    .note { max-width: 38em; color: var(--muted); }
  </style>

  <script>
    const q = (sel) => $slide.querySelector(sel);
    const inputs = [...$slide.querySelectorAll('input:not([data-shuffled])')];
    const value = (sel) => Number(q(sel).value) / 100;

    let three = hues(3);

    function draw() {
      // ramp() is randomRamp with the ranges handed in instead of rolled.
      const anchors = ramp(three, {
        lightness: [value('[data-l0]'), value('[data-l1]')],
        chroma: [value('[data-c0]'), value('[data-c1]')],
        flip: q('[data-flip]').checked,
      }).map(oklch);

      swatches(anchors, q('#anchors'));
      swatches(stretch(anchors, 5, (t, a, b) => mix(a, b, t)), q('#out'));
    }

    // Deck-wide pick mode. rewind() re-picks from the same seed, so flipping
    // this changes *which* three, not the roll.
    const shuffleBox = $slide.querySelector('[data-shuffled]');
    shuffleBox.checked = shuffled();
    const onShuffle = () => { shuffled(shuffleBox.checked); rewind(); three = hues(3); draw(); };
    shuffleBox.addEventListener('input', onShuffle);
    const reroll = () => { reseed(); three = hues(3); draw(); };

    inputs.forEach((input) => input.addEventListener('input', draw));
    q('button').addEventListener('click', reroll);
    draw();

    return () => inputs.forEach((input) => input.removeEventListener('input', draw));
  </script>
</main>
