<main data-slide>
  <h2>OKHSL, my <em>favourite</em></h2>

  <div class="stack">
    <div data-strip data-flush class="row"></div>
    <div data-strip data-flush class="row" id="greys"></div>
    <div class="numbers"></div>
  </div>

  <p class="note">
    Ottosson's picker space: HSL's three handles, on OKLab's lightness. The same
    six, <code>s: 1</code>, one lightness. Saturation is <mark>relative to the
    gamut</mark>, so 100% exists for every hue — no chroma to cap for blue.
    Measured: <mark data-low></mark> to <mark data-high></mark>.
    <mark>HSL's ease, OKLCH's honesty.</mark>
    <a href="https://codepen.io/meodai/full/JxgjNX" target="_blank" rel="noopener">See it on CodePen</a>.
  </p>

  <style>
    .stack { display: grid; gap: 2px; width: min(100%, 46em); }
    .row { height: 6em; }

    .numbers {
      display: flex;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: var(--step--2);
      color: var(--muted);
    }

    .numbers > * { flex: 1; text-align: center; }

    .note { max-width: 40em; color: var(--muted); }
  </style>

  <script>
    // Slide 2's six, by their OK hue (OKHSL shares OKLCH's hue angles).
    const hues6 = Array.from({ length: 6 }, (_, i) => toOklch(hsl({ h: i * 60, c: 0.9, l: 0.5 })).h);

    // Full saturation for every hue. In OKHSL that is always in gamut — the
    // space does the reasoning slide 8 had to do by hand.
    const colors = hues6.map((h) => okhsl({ h, c: 1, l: 0.8 }));

    swatches(colorDebug(colors, { model: 'oklch' }), $slide.querySelector('.row'));
    swatches(colors.map(grey), $slide.querySelector('#greys'));

    const measured = colors.map((color) => Math.round(lightness(color) * 100));

    $slide.querySelector('.numbers').replaceChildren(
      ...measured.map((value) => {
        const cell = document.createElement('span');
        cell.textContent = `${value}%`;
        return cell;
      }),
    );

    $slide.querySelector('[data-low]').textContent = `${Math.min(...measured)}%`;
    $slide.querySelector('[data-high]').textContent = `${Math.max(...measured)}%`;
  </script>
</main>
