<main data-slide data-cols>
  <h2 class="full">RYBitten, my <em>playground</em></h2>

  <div class="wheel" data-wheel-disc></div>

  <div class="legend">
    <label class="control">
      <span>wheel</span>
      <select></select>
    </label>

    <div class="corners" data-corners></div>

    <p class="note">
      Every paint wheel I could find — Harris 1766, Goethe, Munsell, Itten, a
      Marvel newsprint chart — as a cube of <mark>eight corner colors</mark>, so
      I could mix inside each one and get a sense of what colors it actually
      produces. Same 24 steps every time; only the wheel changes.
      <a href="https://github.com/meodai/RYBitten" target="_blank" rel="noopener">RYBitten</a>.
    </p>
  </div>

  <style>
    :scope {
      grid-template-columns: 1fr 1fr;
      align-content: center;
      column-gap: var(--space-2xl);
    }

    .wheel {
      width: min(100%, 17em);
      aspect-ratio: 1;
      justify-self: center;
      border-radius: 50%;
      /* a ring, like the outer ring on the wheels slide */
      mask: radial-gradient(circle closest-side, #0000 0 49.5%, #000 49.5%);
    }

    .legend {
      display: grid;
      gap: var(--space-s);
      align-content: center;
    }

    .control {
      display: flex;
      align-items: center;
      gap: var(--space-s);
      font-size: var(--step--1);
      color: var(--muted);
    }

    select {
      max-width: 22em;
      font: inherit;
      color: var(--onBg);
      background: var(--bg);
      border: 1px solid var(--hairline);
      padding: 0.2em 0.5em;
    }

    .corners { display: flex; gap: 2px; height: 2.4em; max-width: 24em; }
    .corners > * { flex: 1; }

    .note { max-width: 24em; color: var(--muted); }
  </style>

  <script>
    const STEPS = 24;
    const select = $slide.querySelector('select');
    const disc = $slide.querySelector('[data-wheel-disc]');

    // `cubes` is RYBitten's Map of historical wheels; each one is eight corner colors.
    for (const [key, { title, author, year }] of cubes) {
      select.add(new Option(`${author} — ${title} (${year})`, key));
    }
    select.value = 'itten';

    function draw() {
      const { cube } = cubes.get(select.value);

      // RYB hue is its own angle: 0 red, 120 yellow, 240 blue.
      const steps = Array.from({ length: STEPS }, (_, i) => ryb({ h: ((i + 0.5) / STEPS) * 360, c: 1, l: 0.5 }, cube));
      disc.style.background = `conic-gradient(${steps
        .map((color, i) => `${color} ${(i / STEPS) * 360}deg ${((i + 1) / STEPS) * 360}deg`)
        .join(', ')})`;

      // The cube itself, in wheel order: white, red, orange, yellow, green, blue, violet, black.
      const corners = [0, 1, 3, 2, 6, 4, 5, 7].map((i) => `rgb(${cube[i].map((v) => Math.round(v * 255)).join(' ')})`);
      swatches(corners, $slide.querySelector('[data-corners]'));

      colorDebug([...corners, ...steps], { model: 'hsl' });
    }

    select.addEventListener('change', draw);
    draw();

    return () => select.removeEventListener('change', draw);
  </script>
</main>
