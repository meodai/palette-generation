<main data-slide>
  <h2>Pick <em>three</em> hues on a ring</h2>

  <div class="stage">
    <div data-wheel></div>
    <div data-strip data-tall></div>
  </div>

  <div class="controls">
    <label><span>min angle</span><input type="range" min="10" max="120" step="1" /><output></output></label>
    <button type="button">reroll</button>
    <p class="sum"></p>
  </div>

  <section data-notes>
    <p class="note">
      Evenly spaced candidates from a random start, and the first three of them.
      <mark>Harmony as a dial, not a rule</mark> — slide the angle and the same
      three pass through analogous, split complement, triad.
      <code>hues(3)</code> leaves the angle open.
    </p>
  </section>

  <style>
    .stage {
      display: flex;
      align-items: center;
      gap: var(--space-l);
      width: min(100%, 46em);
    }

    [data-wheel] { flex: none; width: 11em; }
    [data-strip] { flex: 1; min-width: 0; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-s) var(--space-m);
      font-size: var(--step--1);
      color: var(--muted);
    }

    label { display: flex; align-items: center; gap: var(--space-2xs); }
    input { width: 10em; accent-color: var(--highlight); }

    output, .sum {
      margin: 0;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--onBg);
    }

    output { min-width: 2.6em; }

    button {
      border: 1px solid var(--hairline);
      border-radius: 2px;
      padding: 0.4em 1em;
      background: none;
      color: var(--onBg);
      font: inherit;
      cursor: pointer;
    }

    button:hover { color: var(--highlight); border-color: var(--highlight); }

    .note { max-width: 38em; color: var(--muted); }
  </style>

  <script>
    const angle = $slide.querySelector('input');
    const readout = $slide.querySelector('output');
    const button = $slide.querySelector('button');
    const sum = $slide.querySelector('.sum');

    // The slider sets the spacing for the whole deck, so every later slide
    // picks the same three.
    angle.value = spacing();

    // The whole of hues(), in the open — so the source answers the question.
    // Evenly spaced candidates from a random start; take the first few.
    function hues(count, maxSpacing = spacing()) {
      const step = Math.min(maxSpacing, 360 / count);
      const start = rnd(360);

      const ring = Array.from(
        { length: Math.round(360 / step) },
        (_, i) => (start + i * step) % 360,
      );

      const picked = ring.slice(0, count);
      picked.ring = ring; // kept for drawing the candidates
      return picked;
    }

    function draw() {
      readout.textContent = `${angle.value}°`;

      const three = hues(3);
      // The ring's other candidates as white dots; the picked three on top.
      wheel([
        ...three.ring.filter((h) => !three.includes(h)).map((h) => ({ h, hollow: true })),
        ...three,
      ]);

      // Flat lightness on purpose. It stays flat until the ramp.
      swatches(colorDebug(three.map((h) => hsl({ h, c: 0.85, l: 0.55 })), { model: 'hsl' }));
      sum.textContent = three.map((h) => `${Math.round(h)}°`).join('  ');
    }

    // Same roll, new spacing: rewind so the start hue stays where it was.
    const onAngle = () => { spacing(+angle.value); rewind(); draw(); };
    const next = () => { reseed(); draw(); };

    angle.addEventListener('input', onAngle);
    button.addEventListener('click', next);
    draw();

    return () => {
      angle.removeEventListener('input', onAngle);
      button.removeEventListener('click', next);
    };
  </script>
</main>
